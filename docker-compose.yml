services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: meet_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meet_booking"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_NAME: meet-booking
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/meet_booking
      SEED_ADMIN_LOGIN: admin
      SEED_ADMIN_PASSWORD: admin
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
