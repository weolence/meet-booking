[tool.poetry]
name = "meet-booking"
version = "0.1.0"
description = "Meeting room booking service"
authors = ["weolence"]
readme = "README.md"
packages = [{ include = "app", from = "backend" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.116,<1.0"
uvicorn = { version = ">=0.35,<1.0", extras = ["standard"] }
sqlalchemy = ">=2.0,<3.0"
alembic = ">=1.16,<2.0"
psycopg = { version = ">=3.2,<4.0", extras = ["binary"] }
pyjwt = ">=2.10,<3.0"
pwdlib = { version = ">=0.3,<1.0", extras = ["argon2"] }

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<9.0"
pytest-cov = ">=6.0,<7.0"
httpx = ">=0.28,<1.0"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
